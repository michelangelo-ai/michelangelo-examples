name: Build Triton serving images

# Each project under src/michelangelo_examples/<project>/inferenceserver/
# that ships its own Dockerfile owns its own Triton serving image, built
# from whatever deps its models actually need. This workflow discovers
# every such Dockerfile and builds+pushes it as
# ghcr.io/<owner>/michelangelo-examples-triton-serving:<project>, so adding
# Triton serving to a future project never requires a new workflow file.
on:
  push:
    branches: [main]
    paths:
      - "src/michelangelo_examples/*/inferenceserver/Dockerfile"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/michelangelo-examples-triton-serving

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Find project Triton serving Dockerfiles
        id: find
        run: |
          entries=()
          while IFS= read -r -d '' dockerfile; do
            project=$(echo "$dockerfile" | awk -F'/' '{print $3}')
            entries+=("{\"project\":\"$project\",\"dockerfile\":\"$dockerfile\",\"context\":\"src/michelangelo_examples/$project/inferenceserver\"}")
          done < <(find src/michelangelo_examples -mindepth 3 -maxdepth 3 -path "*/inferenceserver/Dockerfile" -print0)

          if [ ${#entries[@]} -eq 0 ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            matrix=$(printf '%s\n' "${entries[@]}" | jq -s -c '.')
            echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.project }}
            type=sha,prefix=${{ matrix.project }}-sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
