apiVersion: michelangelo.api/v2
kind: Deployment
metadata:
  name: bert-cola-deployment
  namespace: bert-cola
spec:
  # Set this to the model registered by a real train_workflow run's push_step
  # (see the model_name printed in that run's push results).
  desiredRevision:
    name: "<model-name-from-push-step>"
    namespace: bert-cola
  inferenceServer:
    name: bert-cola-is
  strategy:
    rolling: {}
